[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-warehouse"
version = "0.1.0"
description = "Deterministic sample data and SQL Server warehouse exercises"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Achintya Narula" }]
dependencies = ["pymssql==2.4.3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
markers = [
    "integration: requires a running SQL Server instance",
]

[tool.setuptools.packages.find]
where = ["src"]
